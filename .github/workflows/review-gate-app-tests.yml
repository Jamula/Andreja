name: Review gate App tests
run-name: Review gate App tests — ${{ github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/review-gate-policy.js'
      - '.github/scripts/review-gate-app.js'
      - '.github/scripts/record-review-gate-policy.js'
      - '.github/scripts/review-gate-app.test.js'
      - '.github/scripts/fixtures/review-gate-app-scenarios.json'
      - '.github/scripts/review-gate-ruleset.js'
      - '.github/workflows/review-gate-app-tests.yml'
      - 'docs/runbooks/review-gate-app.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/review-gate-policy.js'
      - '.github/scripts/review-gate-app.js'
      - '.github/scripts/record-review-gate-policy.js'
      - '.github/scripts/review-gate-app.test.js'
      - '.github/scripts/fixtures/review-gate-app-scenarios.json'
      - '.github/scripts/review-gate-ruleset.js'
      - '.github/workflows/review-gate-app-tests.yml'
      - 'docs/runbooks/review-gate-app.md'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  unit:
    name: Review gate App fixture and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'

      - name: Run review-gate App tests
        run: node --test .github/scripts/review-gate-app.test.js
