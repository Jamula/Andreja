name: Review gate App administration
run-name: "review-gate-admin:${{ inputs.operation }}:pr=${{ inputs.pr_number }}:head=${{ inputs.head_sha }}"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Audited operation
        required: true
        type: choice
        options:
          - bind-issue
          - reduce-policy
          - break-glass
      pr_number:
        description: Open PR number
        required: true
        type: string
      head_sha:
        description: Exact current PR head SHA
        required: true
        type: string
      base_repository_id:
        description: Exact numeric base repository ID
        required: true
        type: string
      base_repository:
        description: Exact owner/name of the base repository
        required: true
        type: string
      base_ref:
        description: Exact base branch name
        required: true
        type: string
      base_sha:
        description: Exact current base SHA
        required: true
        type: string
      expected_policy_digest:
        description: Exact digest from the newest App check
        required: true
        type: string
      issue_number:
        description: Issue number for bind-issue; 0 otherwise
        required: true
        default: '0'
        type: string
      target_event_ids:
        description: JSON event-ID array for reduce-policy; [] otherwise
        required: true
        default: '[]'
        type: string
      reason:
        description: Specific reason and residual risk (20-2000 characters)
        required: true
        type: string
      audit_url:
        description: Durable issue/PR decision URL in this repository
        required: true
        type: string

permissions:
  contents: read

jobs:
  record:
    name: Record authenticated policy decision
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Mint the dedicated review-gate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REVIEW_GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_GATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out the exact trusted default-branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Record through the App and reevaluate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_GATE_APP_ID: ${{ vars.REVIEW_GATE_APP_ID }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const recorder = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/record-review-gate-policy.js`);
            await recorder.record({ github, context, core });
