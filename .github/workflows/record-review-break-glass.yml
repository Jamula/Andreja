name: Record review break-glass
run-name: Record review break-glass for PR #${{ inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull-request number
        required: true
        type: string
      head_sha:
        description: Exact current 40-character pull-request head SHA
        required: true
        type: string
      confirmation:
        description: Type BREAK GLASS REVIEW GATE exactly
        required: true
        type: string
      reason:
        description: Specific emergency reason and residual risk
        required: true
        type: string
      incident_url:
        description: Durable incident or decision URL in this repository
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: review-break-glass-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  record:
    name: Record current-head human break-glass
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Record durable break-glass decision
        id: break-glass
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const recorder = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/record-review-evidence.js`);
            await recorder.recordBreakGlass({ github, context, core });

      - name: Retain the workflow-bound break-glass identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.break-glass.outputs.artifact-name }}
          path: ${{ steps.break-glass.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 90

      - name: Dispatch serialized gate reevaluation
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'review-completion.yml',
              ref: context.payload.repository.default_branch,
              inputs: { pr_number: String(context.payload.inputs.pr_number) },
            });
