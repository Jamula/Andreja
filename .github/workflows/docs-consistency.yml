name: Docs Consistency

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/scripts/check_docs_consistency.py'
      - '.github/ISSUE_TEMPLATE/decision.yml'
      - '.github/pull_request_template.md'
      - 'tests/test_check_docs_consistency.py'
      - '.github/workflows/docs-consistency.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/scripts/check_docs_consistency.py'
      - '.github/ISSUE_TEMPLATE/decision.yml'
      - '.github/pull_request_template.md'
      - 'tests/test_check_docs_consistency.py'
      - '.github/workflows/docs-consistency.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Test documentation consistency checks
        run: python3 -m unittest tests/test_check_docs_consistency.py

      - name: Check documentation hashes and catalog/seed-table consistency
        run: python3 .github/scripts/check_docs_consistency.py
