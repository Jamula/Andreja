name: Docs Consistency

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/Andreja.Docs/**'
      - 'tests/Andreja.DocsTests/**'
      - 'Andreja.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/scripts/squad-readiness.js'
      - '.github/scripts/squad-readiness.test.js'
      - '.squad/templates/ralph-triage.js'
      - '.github/workflows/squad-heartbeat.yml'
      - '.github/workflows/squad-triage.yml'
      - '.github/ISSUE_TEMPLATE/decision.yml'
      - '.github/pull_request_template.md'
      - 'README.md'
      - '.github/workflows/docs-consistency.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/Andreja.Docs/**'
      - 'tests/Andreja.DocsTests/**'
      - 'Andreja.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/scripts/squad-readiness.js'
      - '.github/scripts/squad-readiness.test.js'
      - '.squad/templates/ralph-triage.js'
      - '.github/workflows/squad-heartbeat.yml'
      - '.github/workflows/squad-triage.yml'
      - '.github/ISSUE_TEMPLATE/decision.yml'
      - '.github/pull_request_template.md'
      - 'README.md'
      - '.github/workflows/docs-consistency.yml'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build documentation tooling and tests
        run: dotnet build tests/Andreja.DocsTests/Andreja.DocsTests.csproj --configuration Release

      - name: Test documentation consistency, feedback readiness, and architecture diagram suites
        run: dotnet test --project tests/Andreja.DocsTests/Andreja.DocsTests.csproj --configuration Release --no-build

      - name: Test Squad triage readiness
        run: node --test .github/scripts/squad-readiness.test.js

      - name: Check plan, artifact hashes, and catalog/seed-table consistency
        run: dotnet run --project src/Andreja.Docs/Andreja.Docs.csproj --configuration Release --no-build -- check-consistency

      - name: Check feedback readiness documentation contracts
        run: dotnet run --project src/Andreja.Docs/Andreja.Docs.csproj --configuration Release --no-build -- check-feedback-readiness

      - name: Check architecture source and deterministic renders
        run: dotnet run --project src/Andreja.Docs/Andreja.Docs.csproj --configuration Release --no-build -- architecture-diagram --check
