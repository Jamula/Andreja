name: Docs Consistency

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/scripts/check_docs_consistency.py'
      - '.github/workflows/docs-consistency.yml'
      - 'scripts/docs/generate_architecture_diagram.py'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/scripts/check_docs_consistency.py'
      - '.github/workflows/docs-consistency.yml'
      - 'scripts/docs/generate_architecture_diagram.py'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Check plan hash and catalog/seed-table consistency
        run: python3 .github/scripts/check_docs_consistency.py

      - name: Check architecture source and deterministic renders
        run: python3 scripts/docs/generate_architecture_diagram.py --check
