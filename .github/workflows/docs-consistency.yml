name: Docs Consistency

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.gitignore'
      - '.mcp.json'
      - '.squad/config.json'
      - '.squad/templates/copilot-instructions.md'
      - '.squad/templates/squad.agent.md.template'
      - '.github/scripts/check_docs_consistency.py'
      - '.github/scripts/check_docs_consistency.test.py'
      - '.github/scripts/check_squad_child_session.py'
      - '.github/scripts/check_squad_child_session.test.py'
      - '.github/workflows/docs-consistency.yml'
      - 'scripts/docs/**'
  pull_request:
    paths:
      - 'docs/**'
      - '.gitignore'
      - '.mcp.json'
      - '.squad/config.json'
      - '.squad/templates/copilot-instructions.md'
      - '.squad/templates/squad.agent.md.template'
      - '.github/scripts/check_docs_consistency.py'
      - '.github/scripts/check_docs_consistency.test.py'
      - '.github/scripts/check_squad_child_session.py'
      - '.github/scripts/check_squad_child_session.test.py'
      - '.github/workflows/docs-consistency.yml'
      - 'scripts/docs/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Test documentation consistency checks
        run: python3 .github/scripts/check_docs_consistency.test.py

      - name: Check plan, artifact hashes, and catalog/seed-table consistency
        run: python3 .github/scripts/check_docs_consistency.py

      - name: Check architecture source and deterministic renders
        run: python3 scripts/docs/generate_architecture_diagram.py --check

      - name: Test architecture PNG structural policy
        run: python3 scripts/docs/test_architecture_diagram.py

      - name: Test Squad child-session contract
        run: python3 .github/scripts/check_squad_child_session.test.py

      - name: Check Squad child-session contract
        run: python3 .github/scripts/check_squad_child_session.py
