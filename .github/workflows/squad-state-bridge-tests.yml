name: Squad State Bridge Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/agents/squad.agent.md'
      - '.github/scripts/validate-squad-state-bridge.js'
      - '.github/scripts/validate-squad-state-bridge.test.js'
      - '.github/workflows/squad-state-bridge-tests.yml'
      - '.mcp.json'
      - '.squad/**'
      - '.squad/**/.gitignore'
      - '.gitignore'
      - '**/.gitignore'
      - 'docs/operations/squad-state-bridge.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/agents/squad.agent.md'
      - '.github/scripts/validate-squad-state-bridge.js'
      - '.github/scripts/validate-squad-state-bridge.test.js'
      - '.github/workflows/squad-state-bridge-tests.yml'
      - '.mcp.json'
      - '.squad/**'
      - '.squad/**/.gitignore'
      - '.gitignore'
      - '**/.gitignore'
      - 'docs/operations/squad-state-bridge.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'

      - name: Validate static contract
        run: node .github/scripts/validate-squad-state-bridge.js

      - name: Test failure handling
        run: node --test .github/scripts/validate-squad-state-bridge.test.js
