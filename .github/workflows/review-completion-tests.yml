name: Review completion tests

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/review-completion.js'
      - '.github/scripts/run-review-completion.js'
      - '.github/scripts/record-review-evidence.js'
      - '.github/scripts/review-completion.test.js'
      - '.github/scripts/fixtures/review-completion-scenarios.json'
      - '.github/scripts/review-gate-ruleset.js'
      - '.github/workflows/review-completion.yml'
      - '.github/workflows/record-review-break-glass.yml'
      - '.github/workflows/review-completion-tests.yml'
      - '.github/workflows/sync-squad-labels.yml'
      - '.squad/templates/workflows/sync-squad-labels.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/review-completion.js'
      - '.github/scripts/run-review-completion.js'
      - '.github/scripts/record-review-evidence.js'
      - '.github/scripts/review-completion.test.js'
      - '.github/scripts/fixtures/review-completion-scenarios.json'
      - '.github/scripts/review-gate-ruleset.js'
      - '.github/workflows/review-completion.yml'
      - '.github/workflows/record-review-break-glass.yml'
      - '.github/workflows/review-completion-tests.yml'
      - '.github/workflows/sync-squad-labels.yml'
      - '.squad/templates/workflows/sync-squad-labels.yml'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  unit:
    name: Review gate fixture and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'

      - name: Run review-completion tests
        run: node --test .github/scripts/review-completion.test.js
