name: Squad Heartbeat (Ralph)
# Canonical source: .squad-templates/workflows/squad-heartbeat.yml.
# Run node scripts/sync-templates.mjs --sync for root, CLI and SDK mirrors;
# update the active .github/workflows copy while preserving repo-specific steps.

on:
  # React to completed work or new squad work
  issues:
    types: [closed, labeled]
  # pull_request_target (not pull_request): GITHUB_TOKEN is forced read-only
  # for `pull_request` events triggered by a fork, so write steps below
  # (addLabels/createComment) 403 on fork PR closes.
  # Safe here because the checkout step below has no `ref:` override, so it
  # always checks out the BASE ref — no fork code or fork-controlled input
  # is ever read or executed by this job.
  pull_request_target:
    types: [closed]

  # Recover Copilot handoffs that did not complete when first dispatched.
  schedule:
    - cron: '*/15 * * * *'

  # Manual trigger
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  pull-requests: read
  actions: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4

      - name: Check triage script
        id: check-script
        run: |
          if [ -f ".squad/templates/ralph-triage.js" ]; then
            echo "has_script=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_script=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ ralph-triage.js not found — run 'squad upgrade' to install"
          fi

      - name: Ralph — Smart triage
        if: steps.check-script.outputs.has_script == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .squad/templates/ralph-triage.js \
            --squad-dir .squad \
            --output triage-results.json

      - name: Ralph — Apply triage decisions
        if: steps.check-script.outputs.has_script == 'true' && hashFiles('triage-results.json') != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7
        with:
          script: |
            const fs = require('fs');
            const path = 'triage-results.json';
            if (!fs.existsSync(path)) {
              core.info('No triage results — board is clear');
              return;
            }
            
            const results = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (results.length === 0) {
              core.info('📋 Board is clear — Ralph found no untriaged issues');
              return;
            }
            const autoAssign = /<!--\s*copilot-auto-assign:\s*true\s*-->/i
              .test(fs.readFileSync('.squad/team.md', 'utf8'));
            
            for (const decision of results) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: decision.issueNumber,
                  labels: [decision.label]
                });
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: decision.issueNumber,
                  body: [
                    '### 🔄 Ralph — Auto-Triage',
                    '',
                    `**Assigned to:** ${decision.assignTo}`,
                    `**Reason:** ${decision.reason}`,
                    `**Source:** ${decision.source}`,
                    '',
                    '> Ralph auto-triaged this issue using routing rules.',
                    '> To reassign, swap the `squad:*` label.'
                  ].join('\n')
                });

                if (decision.label === 'squad:copilot' && autoAssign) {
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: 'squad-issue-assign.yml',
                    ref: context.payload.repository.default_branch,
                    inputs: { issue_number: String(decision.issueNumber) }
                  });
                  core.info(`Dispatched squad-issue-assign.yml for auto-assigned issue #${decision.issueNumber}`);
                }
                
                core.info(`Triaged #${decision.issueNumber} → ${decision.assignTo} (${decision.source})`);
              } catch (e) {
                core.warning(`Failed to triage #${decision.issueNumber}: ${e.message}`);
                if (decision.label === 'squad:copilot' && autoAssign) {
                  core.setFailed(`Failed to dispatch Copilot assignment for #${decision.issueNumber}: ${e.message}`);
                }
              }
            }
            
            core.info(`🔄 Ralph triaged ${results.length} issue(s)`);

      - name: Ralph — Recover pending Copilot handoffs
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b #v7
        with:
          script: |
            const fs = require('fs');
            const teamPath = '.squad/team.md';
            if (!fs.existsSync(teamPath)) {
              core.info('No .squad/team.md found — skipping Copilot recovery');
              return;
            }

            const team = fs.readFileSync(teamPath, 'utf8');
            const hasCopilot = team.includes('@copilot');
            const autoAssign = /<!--\s*copilot-auto-assign:\s*true\s*-->/i.test(team);
            if (!hasCopilot || !autoAssign) {
              core.info('Copilot auto-assignment is not enabled — skipping recovery');
              return;
            }

            const { owner, repo } = context.repo;
            const query = `repo:${owner}/${repo} is:issue is:open label:"squad:copilot" no:assignee`;
            const { data: search } = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 100,
              sort: 'created',
              order: 'asc'
            });
            const candidates = (search.items || []).filter(issue => !issue.pull_request);
            if (candidates.length === 0) {
              core.info('No pending unassigned squad:copilot issues');
              return;
            }

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            let dispatched = 0;
            let failures = 0;
            for (const candidate of candidates) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: candidate.number
                });
                const hasCopilotLabel = issue.labels.some(label => label.name === 'squad:copilot');
                if (issue.state !== 'open' || issue.assignees.length > 0 || !hasCopilotLabel) {
                  continue;
                }

                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: 'squad-issue-assign.yml',
                  ref: repository.default_branch,
                  inputs: { issue_number: String(issue.number) }
                });
                dispatched += 1;
                core.info(`Dispatched squad-issue-assign.yml for pending issue #${issue.number}`);
              } catch (error) {
                failures += 1;
                core.warning(`Failed to recover Copilot handoff for #${candidate.number}: ${error.message}`);
              }
            }

            core.info(`Copilot recovery dispatched ${dispatched} of ${candidates.length} bounded candidates`);
            if (failures > 0) {
              core.setFailed(`Failed to dispatch ${failures} pending Copilot handoff(s)`);
            }
