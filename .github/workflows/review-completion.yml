name: Review completion
run-name: Review completion — ${{ github.event_name }}

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created]
  issues:
    types: [edited, labeled, unlabeled, closed, reopened]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull-request number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    review-completion-${{
      (github.event_name == 'issues' &&
      format('issue-{0}', github.event.issue.number)) ||
      inputs.pr_number ||
      github.event.pull_request.number ||
      github.event.issue.number ||
      github.event.merge_group.head_sha ||
      github.sha }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Trusted review metadata evaluation
    if: >-
      github.event_name != 'issues' &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && github.event.comment.body == '/review-gate'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate current-head review completion
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runner = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/run-review-completion.js`);
            await runner.run({ github, context, core });

  dispatch-linked-issue:
    name: Dispatch linked PR reevaluation
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Dispatch one serialized evaluation per linked PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runner = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/run-review-completion.js`);
            await runner.dispatchLinkedIssue({ github, context, core });
