name: Review gate App bridge
run-name: Review gate App — ${{ github.event_name }}

on:
  pull_request_target:
    types: [opened, edited, reopened, closed, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_thread:
    types: [resolved, unresolved]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [deleted]
  issues:
    types: [edited, labeled, unlabeled, closed, reopened]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to reevaluate
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    name: Publish trusted review policy
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Mint the dedicated review-gate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REVIEW_GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_GATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out the exact trusted default-branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Start, evaluate, and generation-guard the App check
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_GATE_APP_ID: ${{ vars.REVIEW_GATE_APP_ID }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const gate = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/review-gate-app.js`);
            await gate.run({ github, context, core });
