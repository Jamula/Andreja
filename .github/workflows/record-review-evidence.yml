name: Record review evidence
run-name: Record ${{ inputs.domain }} review evidence for PR #${{ inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull-request number
        required: true
        type: string
      head_sha:
        description: Exact current 40-character pull-request head SHA
        required: true
        type: string
      domain:
        description: Independent review domain
        required: true
        type: choice
        options: [architecture, security, privacy, quality]
      verdict:
        description: Independent review verdict
        required: true
        type: choice
        options: [approved, rejected]
      reviewer:
        description: Independent reviewer identity; cannot be the PR author
        required: true
        type: string
      evidence_url:
        description: Durable issue, PR, review, or comment URL in this repository
        required: true
        type: string
      summary:
        description: Bounded finding and disposition summary
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: review-evidence-${{ inputs.pr_number }}-${{ inputs.domain }}
  cancel-in-progress: false

jobs:
  record:
    name: Record current-head independent review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Record durable review evidence
        id: evidence
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const recorder = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/record-review-evidence.js`);
            await recorder.recordReviewEvidence({ github, context, core });

      - name: Retain the workflow-bound evidence identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.evidence.outputs.artifact-name }}
          path: ${{ steps.evidence.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 90

      - name: Dispatch serialized gate reevaluation
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'review-completion.yml',
              ref: context.payload.repository.default_branch,
              inputs: { pr_number: String(context.payload.inputs.pr_number) },
            });
