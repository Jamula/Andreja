name: Squad Issue Assign

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  assign-work:
    # Only trigger on squad:{member} labels (not the base "squad" label)
    if: startsWith(github.event.label.name, 'squad:')
    concurrency:
      group: squad-issue-assign-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Identify assigned member and trigger work
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const label = context.payload.label.name;

            function slugify(value) {
              return value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            }

            // Extract member slug from label (e.g., "squad:deanna-troi" → "deanna-troi")
            const memberName = label.replace('squad:', '').toLowerCase();
            const isCopilotAssignment = memberName === 'copilot';
            if (isCopilotAssignment) {
              core.info('Copilot acknowledgment is posted only after assignment is accepted.');
              return;
            }

            const teamFile = '.squad/team.md';
            if (!fs.existsSync(teamFile)) {
              core.warning('No .squad/team.md found — cannot assign work');
              return;
            }

            const content = fs.readFileSync(teamFile, 'utf8');
            const lines = content.split('\n');

            let assignedMember = null;
            let inMembersTable = false;
            for (const line of lines) {
              if (line.match(/^##\s+(Members|Team Roster)/i)) {
                inMembersTable = true;
                continue;
              }
              if (inMembersTable && line.startsWith('## ')) {
                break;
              }
              if (inMembersTable && line.startsWith('|') && !line.includes('---') && !line.includes('Name')) {
                const cells = line.split('|').map(c => c.trim()).filter(Boolean);
                if (cells.length >= 2 && slugify(cells[0]) === memberName) {
                  assignedMember = { name: cells[0], role: cells[1] };
                  break;
                }
              }
            }

            if (!assignedMember) {
              core.warning(`No member found matching label "${label}"`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `⚠️ No squad member found matching label \`${label}\`. Check \`.squad/team.md\` for valid member names.`
              });
              return;
            }

            // Post assignment acknowledgment
            const comment = [
                `### 📋 Assigned to ${assignedMember.name} (${assignedMember.role})`,
                '',
                `**Issue:** #${issue.number} — ${issue.title}`,
                '',
                `${assignedMember.name} will pick this up in the next Copilot session.`,
                '',
                `> **For Copilot coding agent:** If enabled, this issue will be worked automatically.`,
                `> Otherwise, start a Copilot session and say:`,
                `> \`${assignedMember.name}, work on issue #${issue.number}\``,
              ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment
            });

            core.info(`Issue #${issue.number} assigned to ${assignedMember.name} (${assignedMember.role})`);

      # Separate step: assign @copilot using PAT (required for coding agent)
      - name: Assign @copilot coding agent
        if: github.event.label.name == 'squad:copilot'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.issue.number;
            const copilotLogin = 'copilot-swe-agent[bot]';
            const label = context.payload.label.name;
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            if (issue.state !== 'open' ||
                !issue.labels.some(existing => existing.name === label)) {
              core.info(`Issue #${issue_number} is closed or no longer has ${label}; skipping stale Copilot handoff.`);
              return;
            }
            if ((issue.assignees || []).some(assignee => assignee?.login === copilotLogin)) {
              core.info(`Issue #${issue_number} is already assigned to Copilot; skipping duplicate handoff.`);
              return;
            }

            // Get the default branch name (main, master, etc.)
            const { data: repoData } = await github.rest.repos.get({ owner, repo });
            const baseBranch = repoData.default_branch;

            const response = await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/assignees', {
              owner,
              repo,
              issue_number,
              assignees: [copilotLogin],
              agent_assignment: {
                target_repo: `${owner}/${repo}`,
                base_branch: baseBranch,
                custom_instructions: '',
                custom_agent: '',
                model: ''
              },
              headers: {
                'X-GitHub-Api-Version': '2022-11-28'
              }
            });
            if (![200, 201].includes(response?.status) ||
                !Array.isArray(response?.data?.assignees) ||
                !response.data.assignees.some(assignee => assignee?.login === copilotLogin)) {
              throw new Error(`Copilot assignment API did not confirm ${copilotLogin} for issue #${issue_number}; handoff is unverified.`);
            }
            core.info(`Copilot assignment API accepted issue #${issue_number} (base: ${baseBranch}); session creation is not verified.`);
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: [
                '### 🤖 Copilot assignment API accepted',
                '',
                `**Issue:** #${issue_number} — ${issue.title}`,
                `The API accepted the coding-agent request and returned \`${copilotLogin}\` as an assignee (base: \`${baseBranch}\`).`,
                '',
                `This is not proof of a running session. Verify a Copilot session linked to this issue or a linked \`copilot/${issue.number}-{slug}\` draft PR before treating the handoff as started.`,
              ].join('\n')
            });
