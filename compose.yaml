name: andreja

services:
  app:
    image: ${ANDREJA_IMAGE:?Set ANDREJA_IMAGE to an immutable name@sha256 digest}
    user: "1654:1654"
    read_only: true
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Andreja__InstanceName: ${ANDREJA_INSTANCE_NAME:-local}
      Andreja__Operations__DataProtectionKeysPath: /var/lib/andreja/keys
      Andreja__Operations__Database__Enabled: "true"
      Andreja__Operations__Database__Host: postgres
      Andreja__Operations__Database__Port: "5432"
      Andreja__Operations__Database__Name: ${POSTGRES_DB:-andreja}
      Andreja__Operations__Database__Username: ${POSTGRES_USER:-andreja}
      Andreja__Operations__Database__PasswordFile: /run/secrets/postgres_password
      Andreja__OpenLoops__Enabled: "true"
      Andreja__OpenLoops__PublicOrigin: http://127.0.0.1:8080
      Andreja__OpenLoops__AssistantProvider: ${ANDREJA_ASSISTANT_PROVIDER:-deterministic}
      Andreja__Identity__RelyingPartyId: ${ANDREJA_HOSTNAME:-localhost}
      Andreja__Identity__AllowedOrigins__0: ${ANDREJA_PUBLIC_ORIGIN:-https://${ANDREJA_HOSTNAME:-localhost}}
      Andreja__Identity__TrustedProxyAddresses__0: ${ANDREJA_TRUSTED_PROXY_IP:?Set ANDREJA_TRUSTED_PROXY_IP to the exact proxy address observed by Kestrel}
      Andreja__Identity__BootstrapTokenFile: /run/secrets/bootstrap_token
      Andreja__Telemetry__Enabled: "true"
      Andreja__Telemetry__ServiceName: andreja
      Andreja__Telemetry__OtlpEndpoint: http://otel-collector:4317
      AllowedHosts: ${ANDREJA_HOSTNAME:-localhost};127.0.0.1
    ports:
      - "${ANDREJA_BIND_ADDRESS:-127.0.0.1}:${ANDREJA_HTTP_PORT:-8080}:8080"
    secrets:
      - postgres_password
      - bootstrap_token
    volumes:
      - data-protection-keys:/var/lib/andreja/keys
      - attachments:/var/lib/andreja/attachments
    tmpfs:
      - /tmp:size=64m,mode=1700,uid=1654,gid=1654
    networks:
      - edge
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - dotnet
        - Andreja.AppHost.dll
        - --health-check
        - http://127.0.0.1:8080/health/ready
      interval: 15s
      timeout: 6s
      start_period: 20s
      retries: 4

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3}
    user: "999:999"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-andreja}
      POSTGRES_USER: ${POSTGRES_USER:-andreja}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.135.0@sha256:89107a3a8f4636a396927edf7025bb9614b8da2d92f4cc3f43109e8d115736e2}
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    tmpfs:
      - /tmp:size=32m,mode=1700,uid=10001,gid=10001
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5

  prometheus:
    profiles:
      - evidence
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.6.0@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64}
    user: "65534:65534"
    read_only: true
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    tmpfs:
      - /tmp:size=32m,mode=1700,uid=65534,gid=65534
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./deploy/secrets/postgres_password}
  bootstrap_token:
    file: ${ANDREJA_BOOTSTRAP_TOKEN_FILE:-./deploy/secrets/bootstrap_token}

volumes:
  postgres-data:
  data-protection-keys:
  attachments:
  prometheus-data:

networks:
  edge:
  backend:
    internal: true
