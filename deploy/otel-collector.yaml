extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
  attributes/suppress:
    actions:
      - key: task
        action: delete
      - key: prompt
        action: delete
      - key: response
        action: delete
      - key: token
        action: delete
      - key: user.id
        action: delete
      - key: enduser.id
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: password
        action: delete
      - key: recovery
        action: delete
      - key: connector.content
        action: delete
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  nop:
  prometheus:
    endpoint: 0.0.0.0:9464
    enable_open_metrics: true

service:
  extensions:
    - health_check
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - attributes/suppress
        - batch
      exporters:
        - nop
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - attributes/suppress
        - batch
      exporters:
        - prometheus
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - attributes/suppress
        - batch
      exporters:
        - nop
